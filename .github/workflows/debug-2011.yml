name: debug-2011
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Replicate the accumulation pattern up through 2015
        run: |
          python - <<'PYEOF'
          import time
          from pathlib import Path

          from pipelines.core.convert import dedupe_most_complete
          from pipelines.core.download import download
          from pipelines.core.http import new_session
          from pipelines.retrosheet import RETROSHEET
          from pipelines.retrosheet.convert import read_season
          from pipelines.retrosheet.schema import PRIMARY_KEYS
          from pipelines.retrosheet.seasons import discover_seasons, season_zip_url

          def p(msg):
              print(msg, flush=True)

          def vm_rss_mb():
              with open("/proc/self/status") as f:
                  for line in f:
                      if line.startswith("VmRSS:"):
                          return int(line.split()[1]) / 1024
              return -1.0

          session = new_session()
          all_seasons = discover_seasons(session)
          seasons = [s for s in all_seasons if int(s) <= 2015]
          p(f"replicating accumulation for {len(seasons)} seasons, 1897..2015")

          fresh_by_table = {}
          t_all = time.time()
          for i, season in enumerate(seasons):
              t0 = time.time()
              zip_path = Path(f"{season}.zip")
              if not zip_path.exists():
                  download((season_zip_url(season),), zip_path, session=session, user_agent="debug")
              for name, df in read_season(zip_path, season).items():
                  fresh_by_table.setdefault(name, {})[season] = df
              zip_path.unlink()
              dt = time.time() - t0
              rss = vm_rss_mb()
              p(f"{i + 1}/{len(seasons)} season {season}: {dt:.2f}s, VmRSS={rss:.0f}MB, total={time.time() - t_all:.1f}s")
              if dt > 10:
                  p(f"  !!! SLOW: season {season} took {dt:.2f}s")

          p("ALL DONE")
          PYEOF
