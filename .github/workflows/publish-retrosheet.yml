name: publish-retrosheet
on:
  schedule: [{cron: "37 14 * * *"}]  # daily, 14:37 UTC
  workflow_dispatch:
    inputs:
      force: {type: boolean, default: false}
      dry_run: {type: boolean, default: false}
      delay: {type: string, default: ""}
permissions:
  contents: write
  issues: write
concurrency: publish-retrosheet
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          DELAY: ${{ inputs.delay }}
        run: |
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$DELAY" ] && args+=(--delay "$DELAY")
          python -m pipelines retrosheet all "${args[@]}"
      - name: Close alerts after a successful run
        if: success() && inputs.dry_run != true
        run: >
          python -m pipelines.core.alerts retrosheet --resolve --stages detect,build,publish
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Alert on failure
        if: failure()
        run: >
          python -m pipelines.core.alerts retrosheet
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
